[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "illugen-mcp"
dynamic = ["version"]
description = "MCP server for JangaFX IlluGen: let AI agents build, edit and render IlluGen node graphs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "dokaNc" }]
keywords = ["mcp", "model-context-protocol", "illugen", "jangafx", "vfx", "procedural", "textures", "claude", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = ["mcp>=1.10,<2", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
illugen-mcp = "illugen_mcp.server:main"

[project.urls]
Homepage = "https://github.com/dokaNc/illugen-mcp"
Issues = "https://github.com/dokaNc/illugen-mcp/issues"

[tool.hatch.version]
path = "illugen_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["illugen_mcp"]

[tool.hatch.build.targets.sdist]
include = ["illugen_mcp", "tests", "examples", "scripts", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["engine: needs a local IlluGen installation (Windows)"]
